<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Explorer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold fs-2" href="#" id="brandLink">🎨 Art Explorer</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav ms-auto gap-lg-3">
          <li class="nav-item">
            <a class="nav-link active" href="#" id="navSearch">Search</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="navFavorites">Favorites <span id="favoritesCountBadge" class="favorites-count-badge d-none">0</span></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <section id="searchView" class="view-section">
      <div class="search-panel card shadow-sm mx-auto">
        <div class="card-body p-3 p-md-4">
          <div class="row g-3 align-items-center">
            <div class="col-12 col-md-6 col-lg-5">
              <input id="queryInput" class="form-control form-control-lg" type="text" placeholder="Search artworks..." />
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <select id="sourceSelect" class="form-select form-select-lg">
                <option value="both">Both Museums</option>
                <option value="met">Met Museum</option>
                <option value="harvard">Harvard Art</option>
              </select>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="hasImageCheck" checked />
                <label class="form-check-label fs-5" for="hasImageCheck" id="imageFilterLabel">Has Image</label>
              </div>
            </div>
            <div class="col-12 col-lg-3 d-grid">
              <button id="searchBtn" class="btn btn-primary btn-lg">Search</button>
            </div>
          </div>
        </div>
      </div>

      <div class="results-meta mt-4 px-1">
        <h2 id="resultCountText" class="h1 fw-bold mb-3"></h2>
      </div>

      <div id="loadingSkeleton" class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4 d-none"></div>
      <div id="resultsGrid" class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4"></div>

      <div id="searchError" class="search-error text-danger d-none">Please enter a search term</div>

      <div class="d-flex justify-content-center align-items-center gap-3 py-4">
        <button id="prevBtn" class="btn btn-outline-secondary">Previous</button>
        <span id="pageInfo" class="fw-semibold"></span>
        <button id="nextBtn" class="btn btn-outline-secondary">Next</button>
      </div>
    </section>

    <section id="detailView" class="view-section d-none">
      <div class="mb-4">
        <button id="backBtn" class="btn btn-outline-secondary btn-lg">← Back to Results</button>
      </div>

      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-5">
          <img id="detailImage" class="detail-image w-100 rounded shadow-sm" alt="Artwork image" />
          <button id="favoriteBtn" class="btn btn-outline-danger btn-lg w-100 mt-3">♡ Add to Favorites</button>
        </div>

        <div class="col-12 col-lg-7">
          <h1 id="detailTitle" class="display-4 fw-bold mb-2"></h1>
          <p id="detailArtist" class="fs-1 text-muted mb-4"></p>

          <ul class="nav nav-tabs fs-3" id="detailTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabOverview" type="button">Overview</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabBio" type="button">Artist Biography</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabWorks" type="button">Related Works</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMap" type="button">Museum Location</button>
            </li>
          </ul>

          <div class="tab-content border border-top-0 rounded-bottom p-4 bg-white shadow-sm">
            <div class="tab-pane fade show active" id="tabOverview">
              <div id="overviewContent"></div>
            </div>
            <div class="tab-pane fade" id="tabBio">
              <div id="bioContent">Loading biography...</div>
            </div>
            <div class="tab-pane fade" id="tabWorks">
              <div id="worksContent">Loading related works...</div>
            </div>
            <div class="tab-pane fade" id="tabMap">
              <div id="mapInfo" class="map-info"></div>
              <div id="mapContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="favoritesView" class="view-section d-none">
      <div class="favorites-header">
        <h2>My Favorites</h2>
      </div>
      <div id="favoritesEmpty" class="favorites-empty d-none">
        <div class="favorites-empty-icon">🎨</div>
        <div class="favorites-empty-text">You haven't saved any favorites yet. Start exploring and add some artworks!</div>
      </div>
      <div id="favoritesGrid" class="favorites-grid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
